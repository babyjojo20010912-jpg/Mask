<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>路径遮罩工作台</title>
  <style>
    :root { --ink:#202720; --paper:#edf0e8; --panel:#f8f9f5; --line:#cbd2c5; --lime:#b8d850; --orange:#ee7045; --muted:#667067; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(120deg,#e4e9de,#f5f2e9); color:var(--ink); font-family:Georgia,"Noto Serif SC",serif; }
    .app { min-height:100vh; display:grid; grid-template-columns:272px minmax(0,1fr); }
    [hidden] { display:none !important; }
    aside { padding:24px 18px; background:#f4f6ef; border-right:1px solid var(--line); overflow:auto; }
    h1 { margin:0 0 4px; font-size:27px; letter-spacing:0; } .sub { color:var(--muted); font-size:13px; line-height:1.45; margin:0 0 26px; }
    section { border-top:1px solid var(--line); padding:17px 0; } h2 { margin:0 0 13px; font-size:13px; letter-spacing:0; text-transform:uppercase; }
    label { display:block; font-size:12px; margin:12px 0 5px; color:#394239; } input[type=range], input[type=file] { width:100%; accent-color:#557326; }
    .value { float:right; font-variant-numeric:tabular-nums; color:var(--muted); }
    .modes { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; } button { border:1px solid #9aa591; color:var(--ink); background:#fbfcf8; min-height:34px; padding:7px 9px; font:600 12px/1 Georgia,"Noto Serif SC",serif; cursor:pointer; } button:hover { background:#e7edda; } button.active { background:var(--lime); border-color:#709333; } .wide { width:100%; margin-top:9px; } .export { background:var(--orange); border-color:#b94b2d; color:#24160f; }
    main { display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; min-height:100vh; } header { display:flex; align-items:center; justify-content:space-between; padding:18px 25px; border-bottom:1px solid var(--line); background:rgba(248,249,245,.75); } .status { font-size:12px; color:var(--muted); } .legend { display:flex; gap:14px; font-size:12px; align-items:center; } .dot { width:9px; height:9px; display:inline-block; border-radius:50%; margin-right:4px; } .stage { min-height:0; padding:24px; display:grid; place-items:center; } .canvas-wrap { max-width:100%; max-height:100%; box-shadow:0 18px 55px rgba(44,53,35,.15); background:#d8ded2; position:relative; line-height:0; } canvas { display:block; max-width:100%; max-height:calc(100vh - 300px); cursor:crosshair; touch-action:none; } .empty { width:min(650px,100%); aspect-ratio:16/9; display:grid; place-items:center; padding:30px; text-align:center; color:#5d665d; border:1px dashed #96a28e; background:repeating-linear-gradient(45deg,#e7eadf 0 11px,#eef0e9 11px 22px); line-height:1.5; }
    .preview-strip { display:grid; grid-template-columns:repeat(2,minmax(0,260px)); gap:16px; justify-content:center; padding:12px 24px 18px; border-top:1px solid var(--line); background:rgba(248,249,245,.6); } .preview-card { min-width:0; } .preview-label { display:flex; justify-content:space-between; margin-bottom:6px; color:var(--muted); font-size:11px; } .preview-canvas { width:100%; max-height:120px; aspect-ratio:2/1; object-fit:contain; background:repeating-conic-gradient(#d7ddd3 0 25%,#f3f5ef 0 50%) 50%/14px 14px; border:1px solid var(--line); cursor:default; }
    footer { border-top:1px solid var(--line); padding:12px 25px; color:var(--muted); font-size:12px; background:rgba(248,249,245,.7); }
    @media (max-width:720px) { .app { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); padding:16px; } aside section { display:none; } aside section:first-of-type, aside section:nth-of-type(5) { display:block; } main { min-height:65vh; } .stage { padding:13px; } canvas { max-height:42vh; } .preview-strip { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:10px 13px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>路径遮罩</h1><p class="sub">用贝塞尔钢笔沿图案中心线布置锚点，遮罩会自动跟随原图轮廓。</p>
      <section><h2>源图</h2><input id="file" type="file" accept="image/*" /><button id="clear" class="wide">清除全部路径</button></section>
      <section><h2>路径工具</h2><div class="modes"><button data-tool="pen" class="active">钢笔</button><button data-tool="add">加锚点</button><button data-tool="edit">编辑曲线</button></div><div class="modes" style="margin-top:6px"><button id="undo" title="撤销 (Ctrl+Z)">后退</button><button id="redo" title="重做 (Ctrl+Y)">前进</button><button id="deletePath">删除当前</button></div></section>
      <section><h2>本地历史</h2><button id="saveVersion" class="wide">保存当前版本</button><div id="projectHistory" style="margin-top:8px"></div></section>
      <section><h2>笔画适配</h2>
        <label>笔画大小 <span class="value" id="scaleOut">100%</span></label><input id="scale" type="range" min="30" max="250" value="100" />
        <label>向外延展 <span class="value" id="extendOut">0 px</span></label><input id="extend" type="range" min="-25" max="80" value="0" />
        <label>边缘羽化 <span class="value" id="featherOut">4 px</span></label><input id="feather" type="range" min="0" max="50" value="4" />
        <label>前景阈值 <span class="value" id="thresholdOut">32</span></label><input id="threshold" type="range" min="5" max="140" value="32" />
      </section>
      <section><h2>溶解预览</h2><label>溶解进度 <span class="value" id="dissolveOut">0%</span></label><input id="dissolve" type="range" min="0" max="1" step="0.01" value="0" /></section>
      <section><h2>输出底色</h2><div class="modes"><button data-bg="black" class="active">黑底</button><button data-bg="white">白底</button><button data-bg="transparent">透明</button></div><button id="export" class="wide export">导出 PNG</button></section>
    </aside>
    <main>
      <header><strong>遮罩编辑台</strong><span class="status" id="status">导入一张图片开始</span><span class="legend"><span><i class="dot" style="background:#fff;border:1px solid #777"></i>起点</span><span><i class="dot" style="background:#121212"></i>终点</span></span></header>
      <div class="stage"><div class="canvas-wrap"><canvas id="canvas" hidden></canvas><div class="empty" id="empty">导入透明 PNG、白底或纯色底图。<br>按住鼠标或触控笔，沿要处理的图案中心线绘制路径。</div></div></div>
      <div class="preview-strip" id="previewStrip" hidden><div class="preview-card"><div class="preview-label"><span>原图</span><span>100%</span></div><canvas id="sourcePreview" class="preview-canvas"></canvas></div><div class="preview-card"><div class="preview-label"><span>溶解图</span><span id="dissolveState">0%</span></div><canvas id="dissolvePreview" class="preview-canvas"></canvas></div></div>
      <footer>钢笔点击新增节点，右键结束当前路径；加锚点工具可保持曲线形状插点；编辑曲线可拖动锚点与控制柄。</footer>
    </main>
  </div>
  <script>
    const canvas = document.querySelector('#canvas'), ctx = canvas.getContext('2d'), work = document.createElement('canvas'), mask = document.createElement('canvas'), sourcePreview=document.querySelector('#sourcePreview'), dissolvePreview=document.querySelector('#dissolvePreview');
    const controls = ['scale','extend','feather','threshold','dissolve'].reduce((all,id)=>({ ...all, [id]:document.querySelector('#'+id) }),{});
    const output = { scale:document.querySelector('#scaleOut'), extend:document.querySelector('#extendOut'), feather:document.querySelector('#featherOut'), threshold:document.querySelector('#thresholdOut'), dissolve:document.querySelector('#dissolveOut') };
    const state = { image:null, imageData:null, pixels:null, paths:[], activePath:null, dragging:null, pointerStart:null, dragAnchorStart:null, background:'black', tool:'pen', history:[], future:[], changed:false, projectId:null, saveTimer:null };
    const database = new Promise((resolve,reject)=>{const request=indexedDB.open('path-mask-projects',1);request.onupgradeneeded=()=>request.result.createObjectStore('projects',{keyPath:'id',autoIncrement:true});request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
    function updateLabels(){ output.scale.textContent=controls.scale.value+'%'; output.extend.textContent=controls.extend.value+' px'; output.feather.textContent=controls.feather.value+' px'; output.threshold.textContent=controls.threshold.value;const progress=Math.round(Number(controls.dissolve.value)*100)+'%';output.dissolve.textContent=progress;document.querySelector('#dissolveState').textContent=progress; }
    function projectData(){return {id:state.projectId,imageData:state.imageData,paths:state.paths,background:state.background,settings:Object.fromEntries(Object.entries(controls).map(([id,input])=>[id,input.value])),updatedAt:Date.now()};}
    async function renderProjectHistory(){const db=await database,items=await new Promise((resolve,reject)=>{const request=db.transaction('projects').objectStore('projects').getAll();request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});const host=document.querySelector('#projectHistory');host.innerHTML='';items.sort((a,b)=>b.updatedAt-a.updatedAt).forEach(item=>{const row=document.createElement('div');row.style.cssText='display:flex;gap:5px;margin-top:5px;align-items:center';const open=document.createElement('button');open.textContent=new Date(item.updatedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});open.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';open.onclick=()=>restoreProject(item);const remove=document.createElement('button');remove.textContent='删除';remove.onclick=async()=>{const db=await database;db.transaction('projects','readwrite').objectStore('projects').delete(item.id);if(item.id===state.projectId)state.projectId=null;renderProjectHistory();};row.append(open,remove);host.append(row);});}
    async function saveProject(forceNew=false){if(!state.imageData)return;clearTimeout(state.saveTimer);const db=await database,data=projectData();if(forceNew||!state.projectId)delete data.id;const tx=db.transaction('projects','readwrite'),store=tx.objectStore('projects'),request=store.put(data);request.onsuccess=()=>{state.projectId=request.result;renderProjectHistory();};}
    function scheduleSave(){if(!state.imageData)return;clearTimeout(state.saveTimer);state.saveTimer=setTimeout(()=>saveProject(),350);}
    async function restoreProject(project){state.projectId=project.id;state.imageData=project.imageData;state.paths=project.paths||[];state.activePath=null;state.history=[];state.future=[];state.background=project.background||'black';Object.entries(project.settings||{}).forEach(([id,value])=>{if(controls[id])controls[id].value=value;});document.querySelectorAll('[data-bg]').forEach(btn=>btn.classList.toggle('active',btn.dataset.bg===state.background));updateLabels();updateHistoryButtons();loadImage(project.imageData,false);}
    async function restoreLatest(){const db=await database,items=await new Promise((resolve,reject)=>{const request=db.transaction('projects').objectStore('projects').getAll();request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});if(items.length)restoreProject(items.sort((a,b)=>b.updatedAt-a.updatedAt)[0]);renderProjectHistory();}
    function distance(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
    function point(evt){ const r=canvas.getBoundingClientRect(); return {x:(evt.clientX-r.left)*(canvas.width/r.width),y:(evt.clientY-r.top)*(canvas.height/r.height)}; }
    function coverage(x,y){ const ix=Math.max(0,Math.min(work.width-1,Math.round(x))), iy=Math.max(0,Math.min(work.height-1,Math.round(y))); const p=state.pixels.data, i=(iy*work.width+ix)*4, alpha=p[i+3]/255;
      if(alpha < .995) return alpha; const br=state.backgroundRGB; const delta=Math.hypot(p[i]-br[0],p[i+1]-br[1],p[i+2]-br[2]); return Math.max(0,Math.min(1,(delta-Number(controls.threshold.value)*.45)/(255-Number(controls.threshold.value)*.45)));
    }
    function bgEstimate(){ const p=state.pixels.data, w=work.width,h=work.height, samples=[]; for(let x=0;x<w;x+=Math.max(1,Math.floor(w/30))){samples.push(x*4,(h-1)*w*4+x*4)} for(let y=0;y<h;y+=Math.max(1,Math.floor(h/30))){samples.push(y*w*4,(y*w+w-1)*4)} const rgb=[0,0,0]; samples.forEach(i=>{rgb[0]+=p[i];rgb[1]+=p[i+1];rgb[2]+=p[i+2]}); return rgb.map(v=>v/samples.length); }
    function cubic(a,b,c,d,t){const q=1-t;return{x:q*q*q*a.x+3*q*q*t*b.x+3*q*t*t*c.x+t*t*t*d.x,y:q*q*q*a.y+3*q*q*t*b.y+3*q*t*t*c.y+t*t*t*d.y};}
    function normalizedPath(path){ if(path.kind==='pen'){if(path.anchors.length<2)return[];const result=[];for(let i=1;i<path.anchors.length;i++){const a=path.anchors[i-1],b=path.anchors[i],steps=Math.max(8,Math.ceil(distance(a,b)/3));for(let j=0;j<=steps;j++)result.push(cubic(a,a.out||a,b.in||b,b,j/steps));}return result;} if(path.length<2)return[];const result=[path[0]],gap=Math.max(1,Math.min(work.width,work.height)/450);for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i],d=distance(a,b),steps=Math.max(1,Math.ceil(d/gap));for(let j=1;j<=steps;j++)result.push({x:a.x+(b.x-a.x)*j/steps,y:a.y+(b.y-a.y)*j/steps});}return result; }
    function detectedWidths(points){ const max=Math.hypot(work.width,work.height)/3, widths=[]; for(let i=0;i<points.length;i++){const before=points[Math.max(0,i-1)],after=points[Math.min(points.length-1,i+1)], dx=after.x-before.x,dy=after.y-before.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len; let sides=[]; for(const sign of [-1,1]){let last=0; for(let d=0;d<max;d+=1){if(coverage(points[i].x+nx*d*sign,points[i].y+ny*d*sign)<.15){last=d;break;} last=d;} sides.push(last); } widths.push(Math.max(2,(sides[0]+sides[1])/2)); } return widths.map((w,i,a)=>{let sum=0,n=0;for(let j=Math.max(0,i-4);j<=Math.min(a.length-1,i+4);j++){sum+=a[j];n++;}return sum/n;}); }
    function renderMask(){ mask.width=work.width; mask.height=work.height; const m=mask.getContext('2d'); m.clearRect(0,0,mask.width,mask.height); const feather=Number(controls.feather.value),factor=Number(controls.scale.value)/100,extend=Number(controls.extend.value), paths=state.paths.map(normalizedPath).filter(path=>path.length>1); const total=paths.flatMap(path=>path.slice(1).map((p,i)=>distance(path[i],p))).reduce((sum,length)=>sum+length,0); let travelled=0;m.lineCap='round';
      paths.forEach(pts=>{const widths=detectedWidths(pts);for(let i=1;i<pts.length;i++){travelled+=distance(pts[i-1],pts[i]);const gray=Math.round(255*(1-travelled/total)),width=Math.max(1,widths[i]*factor+extend*2);m.strokeStyle=`rgb(${gray},${gray},${gray})`;m.lineWidth=width+feather*2;m.globalAlpha=feather?.25:1;m.beginPath();m.moveTo(pts[i-1].x,pts[i-1].y);m.lineTo(pts[i].x,pts[i].y);m.stroke();m.lineWidth=width;m.globalAlpha=1;m.beginPath();m.moveTo(pts[i-1].x,pts[i-1].y);m.lineTo(pts[i].x,pts[i].y);m.stroke();}});m.globalAlpha=1;
      const pixels=m.getImageData(0,0,mask.width,mask.height);for(let y=0;y<mask.height;y++)for(let x=0;x<mask.width;x++){const i=(y*mask.width+x)*4;pixels.data[i+3]=Math.round(pixels.data[i+3]*coverage(x,y));}m.putImageData(pixels,0,0);
    }
    function smoothstep(start,end,value){const t=Math.max(0,Math.min(1,(value-start)/(end-start)));return t*t*(3-2*t);}
    function renderPreviews(){if(!state.image)return;const width=300,height=Math.max(1,Math.round(width*work.height/work.width));[sourcePreview,dissolvePreview].forEach(preview=>{preview.width=width;preview.height=height;});sourcePreview.getContext('2d').drawImage(work,0,0,width,height);const dissolveCtx=dissolvePreview.getContext('2d');dissolveCtx.drawImage(work,0,0,width,height);const image=dissolveCtx.getImageData(0,0,width,height),maskPixels=mask.getContext('2d').getImageData(0,0,mask.width,mask.height).data,progress=Number(controls.dissolve.value),phase=-.035+progress*1.07;for(let y=0;y<height;y++)for(let x=0;x<width;x++){const previewIndex=(y*width+x)*4,maskX=Math.min(mask.width-1,Math.floor(x*mask.width/width)),maskY=Math.min(mask.height-1,Math.floor(y*mask.height/height)),maskIndex=(maskY*mask.width+maskX)*4,order=1-maskPixels[maskIndex]/255,opacity=1-smoothstep(order-.035,order+.035,phase);image.data[previewIndex+3]=Math.round(image.data[previewIndex+3]*opacity);}dissolveCtx.putImageData(image,0,0);}
    function draw(){if(!state.image)return;renderMask();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(work,0,0);if(state.paths.some(path=>normalizedPath(path).length>1)){ctx.save();ctx.globalAlpha=.62;ctx.drawImage(mask,0,0);ctx.restore();}state.paths.forEach(path=>{const p=normalizedPath(path);if(p.length>1){ctx.lineWidth=2;ctx.strokeStyle=path===state.activePath?'#ee7045':'#9dc93d';ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);p.slice(1).forEach(v=>ctx.lineTo(v.x,v.y));ctx.stroke();[p[0],p[p.length-1]].forEach((v,i)=>{ctx.fillStyle=i?'#101210':'#fff';ctx.strokeStyle='#101210';ctx.lineWidth=2;ctx.beginPath();ctx.arc(v.x,v.y,5,0,Math.PI*2);ctx.fill();ctx.stroke();});}path.anchors.forEach(anchor=>{ctx.strokeStyle='#ee7045';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(anchor.x,anchor.y);ctx.lineTo(anchor.in.x,anchor.in.y);ctx.moveTo(anchor.x,anchor.y);ctx.lineTo(anchor.out.x,anchor.out.y);ctx.stroke();[anchor.in,anchor.out].forEach(handle=>{ctx.fillStyle='#f8f9f5';ctx.strokeStyle='#ee7045';ctx.beginPath();ctx.arc(handle.x,handle.y,4,0,Math.PI*2);ctx.fill();ctx.stroke();});ctx.fillStyle=path===state.activePath?'#ee7045':'#c85a38';ctx.fillRect(anchor.x-4,anchor.y-4,8,8);});});renderPreviews();document.querySelector('#status').textContent=`${work.width} × ${work.height} · ${state.paths.length} 条路径 · 钢笔模式`;}
    function loadImage(data,reset=true){const img=new Image();img.onload=()=>{state.image=img;work.width=mask.width=canvas.width=img.naturalWidth;work.height=mask.height=canvas.height=img.naturalHeight;work.getContext('2d').drawImage(img,0,0);state.pixels=work.getContext('2d').getImageData(0,0,work.width,work.height);state.backgroundRGB=bgEstimate();if(reset){state.paths=[];state.activePath=null;state.history=[];state.future=[];state.projectId=null;updateHistoryButtons();}canvas.hidden=false;document.querySelector('#empty').hidden=true;document.querySelector('#previewStrip').hidden=false;draw();if(reset)saveProject(true);};img.src=data;}
    function loadFile(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{state.imageData=reader.result;loadImage(reader.result);};reader.readAsDataURL(file);}
    document.querySelector('#file').addEventListener('change',e=>loadFile(e.target.files[0]));document.querySelector('.stage').addEventListener('dragover',e=>e.preventDefault());document.querySelector('.stage').addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0]);});
    function snapshot(){return JSON.stringify(state.paths);}
    function restore(value){state.paths=JSON.parse(value);state.activePath=null;state.dragging=null;draw();}
    function commit(before){if(before===snapshot())return;state.history.push(before);if(state.history.length>60)state.history.shift();state.future=[];updateHistoryButtons();scheduleSave();}
    function updateHistoryButtons(){document.querySelector('#undo').disabled=!state.history.length;document.querySelector('#redo').disabled=!state.future.length;}
    function hitTest(p){const radius=10;for(let pathIndex=state.paths.length-1;pathIndex>=0;pathIndex--){const path=state.paths[pathIndex];for(let anchorIndex=path.anchors.length-1;anchorIndex>=0;anchorIndex--){const anchor=path.anchors[anchorIndex];if(distance(p,anchor.in)<radius)return{path,anchor,type:'in'};if(distance(p,anchor.out)<radius)return{path,anchor,type:'out'};if(distance(p,anchor)<radius)return{path,anchor,type:'anchor'};}}return null;}
    function lerp(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};}
    function nearestCurve(p){let best=null;state.paths.forEach(path=>{for(let index=0;index<path.anchors.length-1;index++){const a=path.anchors[index],b=path.anchors[index+1];for(let step=0;step<=40;step++){const t=step/40,q=cubic(a,a.out,b.in,b,t),d=distance(p,q);if(!best||d<best.distance)best={path,index,t,distance:d};}}});return best;}
    function splitCurve(hit){const a=hit.path.anchors[hit.index],b=hit.path.anchors[hit.index+1],t=hit.t;const ab=lerp(a,a.out,t),bc=lerp(a.out,b.in,t),cd=lerp(b.in,b,t),abbc=lerp(ab,bc,t),bccd=lerp(bc,cd,t),middle=lerp(abbc,bccd,t);a.out=ab;b.in=cd;const anchor={x:middle.x,y:middle.y,in:abbc,out:bccd};hit.path.anchors.splice(hit.index+1,0,anchor);state.activePath=hit.path;}
    canvas.addEventListener('contextmenu',e=>{e.preventDefault();if(!state.image)return;const before=snapshot();if(state.activePath&&state.activePath.anchors.length<2)state.paths=state.paths.filter(path=>path!==state.activePath);state.activePath=null;commit(before);draw();});
    canvas.addEventListener('pointerdown',e=>{if(!state.image||e.button!==0)return;const p=point(e),before=snapshot();canvas.setPointerCapture(e.pointerId);state.pointerStart=p;state.changed=false;if(state.tool==='pen'){if(!state.activePath){state.activePath={kind:'pen',anchors:[]};state.paths.push(state.activePath);}const anchor={x:p.x,y:p.y,in:{...p},out:{...p}};state.activePath.anchors.push(anchor);state.dragging={path:state.activePath,anchor,type:'out',before};state.dragAnchorStart={x:p.x,y:p.y,in:{...p},out:{...p}};state.changed=true;}else if(state.tool==='add'){const curve=nearestCurve(p);if(curve&&curve.distance<18){splitCurve(curve);state.changed=true;commit(before);}}else{const hit=hitTest(p);if(hit){state.activePath=hit.path;state.dragging={...hit,before};state.dragAnchorStart={x:hit.anchor.x,y:hit.anchor.y,in:{...hit.anchor.in},out:{...hit.anchor.out}};}}draw();});
    canvas.addEventListener('pointermove',e=>{if(!state.dragging)return;const p=point(e),drag=state.dragging,anchor=drag.anchor,start=state.dragAnchorStart;if(drag.type==='anchor'){const dx=p.x-state.pointerStart.x,dy=p.y-state.pointerStart.y;anchor.x=start.x+dx;anchor.y=start.y+dy;anchor.in={x:start.in.x+dx,y:start.in.y+dy};anchor.out={x:start.out.x+dx,y:start.out.y+dy};}else{anchor[drag.type]=p;const opposite=drag.type==='in'?'out':'in';anchor[opposite]={x:anchor.x-(p.x-anchor.x),y:anchor.y-(p.y-anchor.y)};}state.changed=true;draw();});
    canvas.addEventListener('pointerup',()=>{if(state.dragging&&state.changed)commit(state.dragging.before);state.dragging=null;draw();});
    Object.values(controls).forEach(el=>el.addEventListener('input',()=>{updateLabels();draw();scheduleSave();}));document.querySelector('#clear').onclick=()=>{const before=snapshot();state.paths=[];state.activePath=null;commit(before);draw();};document.querySelectorAll('[data-bg]').forEach(btn=>btn.onclick=()=>{state.background=btn.dataset.bg;document.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('active',b===btn));scheduleSave();});document.querySelectorAll('[data-tool]').forEach(btn=>btn.onclick=()=>{state.tool=btn.dataset.tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b===btn));draw();});document.querySelector('#deletePath').onclick=()=>{if(!state.activePath)return;const before=snapshot();state.paths=state.paths.filter(path=>path!==state.activePath);state.activePath=null;commit(before);draw();};document.querySelector('#undo').onclick=()=>{if(!state.history.length)return;state.future.push(snapshot());restore(state.history.pop());updateHistoryButtons();scheduleSave();};document.querySelector('#redo').onclick=()=>{if(!state.future.length)return;state.history.push(snapshot());restore(state.future.pop());updateHistoryButtons();scheduleSave();};document.querySelector('#saveVersion').onclick=()=>saveProject(true);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProject();});window.addEventListener('pagehide',()=>saveProject());document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;if(e.key.toLowerCase()==='z'){e.preventDefault();document.querySelector('#undo').click();}if(e.key.toLowerCase()==='y'){e.preventDefault();document.querySelector('#redo').click();}});
    document.querySelector('#export').onclick=()=>{if(!state.image||!state.paths.some(path=>path.anchors.length>1))return;renderMask();const result=document.createElement('canvas');result.width=work.width;result.height=work.height;const r=result.getContext('2d'), data=mask.getContext('2d').getImageData(0,0,mask.width,mask.height); for(let i=0;i<data.data.length;i+=4){const gray=data.data[i], localAlpha=coverage((i/4)%work.width,Math.floor(i/4/work.width)),a=Math.round(data.data[i+3]/255*localAlpha*255);if(state.background==='transparent'){data.data[i]=gray;data.data[i+1]=gray;data.data[i+2]=gray;data.data[i+3]=a;}else {const bg=state.background==='white'?255:0, blend=a/255;const value=Math.round(bg*(1-blend)+gray*blend);data.data[i]=data.data[i+1]=data.data[i+2]=value;data.data[i]=data.data[i+1]=data.data[i+2]=value;data.data[i+3]=255;}}r.putImageData(data,0,0);const a=document.createElement('a');a.download='path-mask.png';a.href=result.toDataURL('image/png');a.click();};
    updateLabels();updateHistoryButtons();restoreLatest();
  </script>
