<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>笔画路径钢笔工具</title>
  <style>
    :root {
      --bg:#111722;
      --bg-2:#171f2a;
      --panel:#1b2430;
      --panel-2:#202b3b;
      --panel-3:#283548;
      --line:#38465d;
      --line-soft:#2b3647;
      --text:#edf3ff;
      --muted:#8c9bb0;
      --blue:#5ea5ff;
      --blue-2:#7db2ff;
      --green:#7fe0b0;
      --orange:#ffb86a;
      --shadow:rgba(5,10,18,.45);
    }

    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body {
      min-height:100vh;
      background:radial-gradient(circle at top, #1c2a39 0%, #111722 26%, #0d1219 100%);
      color:var(--text);
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    button, input, select { font:inherit; }
    [hidden] { display:none !important; }

    .app {
      display:flex;
      min-height:100vh;
      background:rgba(12,16,22,.76);
      backdrop-filter:blur(6px);
    }

    .workspace {
      display:flex;
      flex:1;
      min-width:0;
      background:rgba(10,14,19,.74);
    }

    .main-stage {
      flex:1;
      min-width:0;
      border-right:1px solid var(--line-soft);
      display:flex;
      flex-direction:column;
      background:#111923;
    }

    .header-bar {
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      border-bottom:1px solid var(--line-soft);
      background:rgba(23,31,41,.85);
      color:var(--muted);
      font-size:13px;
    }

    .header-bar strong {
      color:var(--text);
      font-weight:600;
      letter-spacing:.3px;
    }

    .legend {
      display:flex;
      align-items:center;
      gap:16px;
      font-size:12px;
    }

    .dot {
      width:9px;
      height:9px;
      display:inline-block;
      border-radius:50%;
      margin-right:6px;
      vertical-align:middle;
    }

    .stage {
      flex:1;
      min-height:0;
      padding:14px 18px;
      display:grid;
      place-items:center;
      background:rgba(15,19,27,.75);
    }

    .canvas-wrap {
      width:100%;
      height:100%;
      min-height:420px;
      position:relative;
      display:grid;
      place-items:center;
      border:1px solid var(--line-soft);
      background:
        linear-gradient(45deg, rgba(255,255,255,.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.02) 75%, rgba(255,255,255,.02)),
        linear-gradient(45deg, rgba(255,255,255,.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.02) 75%, rgba(255,255,255,.02)),
        #0e161f;
      background-size:28px 28px;
      background-position:0 0, 14px 14px;
      overflow:hidden;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
    }

    canvas {
      display:block;
      max-width:100%;
      max-height:100%;
      cursor:crosshair;
      touch-action:none;
    }

    .canvas-cursor-pen { cursor:crosshair; }
    .canvas-cursor-add { cursor:copy; }
    .canvas-cursor-edit { cursor:grab; }

    .empty {
      width:min(700px, 92%);
      padding:32px 28px;
      text-align:center;
      color:var(--muted);
      line-height:1.7;
      border:1px dashed rgba(161,179,200,.35);
      background:rgba(255,255,255,.01);
      border-radius:12px;
      letter-spacing:.3px;
    }

    .canvas-bg-picker {
      position:absolute;
      top:12px;
      left:12px;
      display:flex;
      gap:6px;
      padding:5px 6px;
      border:1px solid rgba(140,155,176,.28);
      border-radius:10px;
      background:rgba(17,24,32,.7);
      backdrop-filter:blur(4px);
      box-shadow:0 8px 20px rgba(0,0,0,.2);
      z-index:2;
    }

    .canvas-top-tools {
      position:absolute;
      top:12px;
      right:12px;
      display:flex;
      gap:8px;
      padding:5px 6px;
      border:1px solid rgba(140,155,176,.28);
      border-radius:10px;
      background:rgba(17,24,32,.72);
      backdrop-filter:blur(4px);
      box-shadow:0 8px 20px rgba(0,0,0,.18);
      z-index:2;
    }

    .canvas-toggle-btn {
      width:30px;
      height:30px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:8px;
      background:rgba(255,255,255,.02);
      color:var(--text);
      display:grid;
      place-items:center;
      cursor:pointer;
      font-size:11px;
      font-weight:700;
      line-height:1;
      padding:0;
      transition:.2s ease;
      letter-spacing:.3px;
    }

    .canvas-toggle-btn.active {
      border-color:rgba(126,168,255,.55);
      background:rgba(94,165,255,.16);
      box-shadow:inset 0 0 0 1px rgba(126,168,255,.12);
    }

    .canvas-icon-btn {
      width:30px;
      height:30px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:8px;
      background:rgba(255,255,255,.02);
      color:var(--text);
      display:grid;
      place-items:center;
      cursor:pointer;
      font-size:18px;
      line-height:1;
      padding:0;
      transition:.2s ease;
    }

    .canvas-icon-btn:hover:not(:disabled) {
      border-color:rgba(126,168,255,.45);
      background:rgba(126,168,255,.08);
    }

    .canvas-icon-btn:disabled {
      opacity:.35;
      cursor:not-allowed;
    }

    .canvas-bg-btn {
      width:28px;
      height:24px;
      border-radius:7px;
      border:1px solid rgba(255,255,255,.18);
      font-size:11px;
      line-height:1;
      color:#dfeaf8;
      background:rgba(255,255,255,.03);
      cursor:pointer;
      padding:0;
      display:grid;
      place-items:center;
      transition:.2s ease;
    }

    .canvas-bg-btn.active {
      border-color:rgba(125,178,255,.7);
      background:rgba(94,165,255,.18);
      box-shadow:inset 0 0 0 1px rgba(125,178,255,.18);
    }

    .canvas-bg-btn[data-canvas-bg="black"] { background:#111; }
    .canvas-bg-btn[data-canvas-bg="white"] { background:#f3f3f3; color:#1a1a1a; }
    .canvas-bg-btn[data-canvas-bg="transparent"] { background:linear-gradient(135deg,#1a2330,#2a3442); }

    .preview-strip {
      display:grid;
      grid-template-columns:1fr;
      justify-content:center;
      padding:12px 18px 14px;
      border-top:1px solid var(--line-soft);
      background:rgba(21,27,37,.88);
    }

    .preview-card {
      min-width:0;
    }

    .preview-label {
      display:flex;
      justify-content:space-between;
      margin-bottom:8px;
      color:var(--muted);
      font-size:11px;
    }

    .preview-canvas {
      width:100%;
      max-height:120px;
      aspect-ratio:2/1;
      object-fit:contain;
      border:1px solid var(--line-soft);
      background:rgba(255,255,255,.02);
      border-radius:8px;
    }

    .dissolve-panel {
      padding:14px 0 4px;
      border-top:1px solid var(--line-soft);
      background:rgba(21,27,37,.88);
      color:var(--text);
    }

    .dissolve-panel .title {
      font-size:16px;
      font-weight:600;
      margin:0 0 10px;
      color:var(--text);
      letter-spacing:.2px;
    }

    .dissolve-panel .row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:8px;
      font-size:12px;
      color:var(--muted);
    }

    .dissolve-panel .row strong {
      color:var(--text);
      font-weight:600;
      font-size:12px;
    }

    .dissolve-panel input[type="range"] {
      width:100%;
      accent-color:#7aa8ff;
      margin-top:2px;
    }

    .header-tools {
      position:relative;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .history-toggle {
      position:relative;
      min-width:86px;
      height:32px;
      padding:0 12px;
      border:1px solid rgba(138,153,176,.28);
      border-radius:10px;
      background:rgba(255,255,255,.03);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      transition:.2s ease;
    }

    .history-toggle:hover {
      border-color:rgba(126,168,255,.45);
      background:rgba(126,168,255,.08);
    }

    .history-count {
      min-width:18px;
      height:18px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg, rgba(94,165,255,.38), rgba(77,118,190,.2));
      color:#edf7ff;
      font-size:10px;
      font-weight:700;
    }

    .version-window {
      position:absolute;
      top:52px;
      right:0;
      width:320px;
      border:1px solid var(--line-soft);
      border-radius:14px;
      background:rgba(17,23,30,.96);
      box-shadow:0 20px 42px rgba(0,0,0,.38);
      z-index:12;
      overflow:hidden;
    }

    .version-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px 10px;
      border-bottom:1px solid var(--line-soft);
      background:rgba(255,255,255,.02);
    }

    .version-title {
      color:var(--text);
      font-size:12px;
      font-weight:700;
      letter-spacing:.8px;
      text-transform:uppercase;
    }

    .mini-save {
      border:1px solid rgba(140,155,176,.28);
      background:rgba(94,165,255,.12);
      color:var(--text);
      border-radius:8px;
      padding:5px 8px;
      cursor:pointer;
      font-size:11px;
    }

    .version-meta {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px 6px;
      color:var(--muted);
      font-size:11px;
      border-bottom:1px solid rgba(255,255,255,.03);
    }

    .version-box {
      max-height:290px;
      overflow:auto;
      padding:8px 10px 12px;
    }

    .version-item {
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 6px;
      border:1px solid transparent;
      border-radius:10px;
      transition:.2s ease;
    }

    .version-item:hover {
      background:rgba(255,255,255,.02);
      border-color:rgba(126,168,255,.18);
    }

    .version-item .version-open {
      flex:1;
      min-width:0;
      text-align:left;
      border:none;
      background:transparent;
      color:var(--text);
      padding:0;
      cursor:pointer;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:12px;
    }

    .version-thumb {
      width:38px;
      height:38px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.02);
      object-fit:cover;
      flex-shrink:0;
      display:block;
    }

    .version-item .version-delete {
      min-height:26px;
      padding:0 8px;
      border-radius:8px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.02);
      color:var(--muted);
      cursor:pointer;
      font-size:11px;
    }

    .version-empty {
      padding:18px 10px 10px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    .panel {
      position:relative;
      width:360px;
      padding:16px 14px 18px;
      background:rgba(21,27,35,.96);
      overflow:auto;
      border-left:1px solid var(--line-soft);
      min-width:260px;
      max-width:520px;
      resize:none;
    }

    .panel .resize-handle,
    .preview-strip .resize-handle {
      position:absolute;
      opacity:0;
      transition:opacity .18s ease, background .18s ease, box-shadow .18s ease;
      z-index:20;
      pointer-events:auto;
    }

    .panel:hover .resize-handle,
    .panel.is-resizing .resize-handle,
    .preview-strip:hover .resize-handle,
    .preview-strip.is-resizing .resize-handle {
      opacity:1;
    }

    .panel .resize-handle {
      top:0;
      right:-6px;
      width:12px;
      height:100%;
      cursor:ew-resize;
      background:linear-gradient(90deg, rgba(126,168,255,.2), rgba(126,168,255,0));
      box-shadow:inset 1px 0 0 rgba(126,168,255,.18);
    }

    .panel .resize-handle::before,
    .preview-strip .resize-handle::before {
      content:"";
      position:absolute;
      inset:0;
      margin:auto;
      border-radius:999px;
      background:rgba(126,168,255,.55);
      box-shadow:0 0 12px rgba(126,168,255,.35);
      transition:transform .18s ease, opacity .18s ease;
      opacity:0;
    }

    .panel:hover .resize-handle::before,
    .panel.is-resizing .resize-handle::before,
    .preview-strip:hover .resize-handle::before,
    .preview-strip.is-resizing .resize-handle::before {
      opacity:1;
    }

    .panel .resize-handle::before {
      width:2px;
      height:80px;
      left:50%;
      transform:translateX(-50%);
    }

    .preview-strip .resize-handle {
      left:0;
      bottom:-6px;
      width:100%;
      height:12px;
      cursor:ns-resize;
      background:linear-gradient(180deg, rgba(126,168,255,.2), rgba(126,168,255,0));
      box-shadow:inset 0 1px 0 rgba(126,168,255,.18);
    }

    .preview-strip .resize-handle::before {
      width:120px;
      height:2px;
      top:50%;
      transform:translateY(-50%);
    }

    .panel section {
      padding:14px 0;
      border-bottom:1px solid var(--line-soft);
    }

    .panel .section-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
    }

    .panel section:last-child { border-bottom:none; }

    .panel h2 {
      margin:0 0 12px;
      font-size:12px;
      font-weight:600;
      letter-spacing:.8px;
      color:var(--muted);
      text-transform:uppercase;
    }

    .panel .group {
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:8px;
    }

    .panel .modes {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }

    .scope-wrap {
      margin-bottom:12px;
    }

    .scope-label {
      margin-bottom:8px;
      color:var(--muted);
      font-size:11px;
      letter-spacing:.5px;
      text-transform:uppercase;
    }

    .scope-switch {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:5px;
      padding:4px;
      border:1px solid rgba(140,155,176,.24);
      border-radius:10px;
      background:rgba(16,22,30,.8);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
    }

    .scope-switch button {
      min-height:30px;
      padding:6px 8px;
      border-radius:8px;
      border:1px solid transparent;
      background:transparent;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.1px;
      transition:.2s ease;
    }

    .scope-switch button.active {
      background:linear-gradient(180deg, rgba(94,165,255,.24), rgba(52,76,111,.18));
      border-color:rgba(126,168,255,.56);
      color:var(--text);
      box-shadow:inset 0 0 0 1px rgba(126,168,255,.12);
    }

    .scope-switch button:not(.active):hover {
      color:var(--text);
      background:rgba(255,255,255,.02);
    }

    .scope-switch button:disabled {
      opacity:.38;
      cursor:not-allowed;
    }

    .panel button {
      min-height:34px;
      border:1px solid var(--line);
      border-radius:10px;
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
      color:var(--text);
      cursor:pointer;
      padding:8px 10px;
      transition:.2s ease;
    }

    .panel button:hover { border-color:rgba(126,168,255,.4); }
    .panel button.active {
      background:linear-gradient(180deg, rgba(94,165,255,.32), rgba(58,88,132,.2));
      border-color:rgba(126,168,255,.65);
      color:var(--text);
      box-shadow:inset 0 0 0 1px rgba(126,168,255,.12);
    }

    .panel .wide { width:100%; margin-top:8px; }
    .panel .export {
      background:linear-gradient(180deg, rgba(255,184,106,.28), rgba(255,141,69,.18));
      border-color:rgba(255,168,96,.5);
      color:#ffd7b2;
    }

    .panel label {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:12px 0 8px;
      color:var(--muted);
      font-size:12px;
    }

    .panel .value {
      color:var(--text);
      font-variant-numeric:tabular-nums;
    }

    .panel input[type="range"] {
      width:100%;
      accent-color:#7aa8ff;
    }

    .file-drop-zone {
      position:relative;
      display:flex;
      align-items:center;
      width:100%;
      min-height:56px;
      padding:0 14px 0 42px;
      border:1px solid rgba(140,155,176,.32);
      border-radius:14px;
      background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      overflow:hidden;
      transition:.2s ease;
      cursor:pointer;
    }

    .file-drop-zone::before {
      content:"＋";
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      font-size:18px;
      line-height:1;
      opacity:.9;
      pointer-events:none;
    }

    .file-drop-zone:hover {
      border-color:rgba(126,168,255,.5);
      box-shadow:inset 0 0 0 1px rgba(126,168,255,.08);
    }

    .file-drop-zone:focus-within {
      border-color:rgba(126,168,255,.75);
      box-shadow:0 0 0 3px rgba(94,165,255,.12);
    }

    .file-drop-zone input[type="file"] {
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .file-drop-zone .file-hint {
      position:relative;
      z-index:1;
      width:100%;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      pointer-events:none;
    }

    .file-drop-zone .file-hint strong {
      color:var(--text);
      font-weight:600;
    }

    .panel .history-box {
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .panel .history-item {
      display:flex;
      gap:8px;
      align-items:center;
    }

    .panel .history-item button:first-child {
      flex:1;
      text-align:left;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .panel footer {
      margin-top:8px;
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
      border-top:1px solid var(--line-soft);
      padding-top:12px;
    }

    @media (max-width:980px) {
      .workspace { flex-direction:column; }
      .main-stage { border-right:none; border-bottom:1px solid var(--line-soft); }
      .panel { width:100%; border-left:none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="workspace">
      <main class="main-stage">
        <header class="header-bar">
          <strong>笔画路径钢笔工具</strong>
          <div class="header-tools">
            <button id="historyToggle" class="history-toggle" type="button">
              <span>版本</span>
              <span class="history-count" id="historyCount">0</span>
            </button>
            <div id="historyPopover" class="version-window" hidden>
              <div class="version-header">
                <span class="version-title">最近版本</span>
                <button id="saveVersion" class="mini-save" type="button">保存当前</button>
              </div>
              <div class="version-meta"><span>当前图片</span><span id="versionMetaLabel">自动记录</span></div>
              <div id="projectHistory" class="version-box"></div>
            </div>
          </div>
          <span class="status" id="status">导入一张图片开始</span>
        </header>

        <div class="stage">
          <div class="canvas-wrap">
            <div class="canvas-bg-picker" aria-label="当前背景选择">
              <button type="button" class="canvas-bg-btn" data-canvas-bg="transparent" title="透明背景">透</button>
              <button type="button" class="canvas-bg-btn active" data-canvas-bg="black" title="黑色背景">黑</button>
              <button type="button" class="canvas-bg-btn" data-canvas-bg="white" title="白色背景">白</button>
            </div>
            <div class="canvas-top-tools" aria-label="画布工具">
              <button id="toggleSource" class="canvas-toggle-btn" type="button" title="显示/隐藏原图" aria-label="切换原图">原</button>
              <button id="togglePaths" class="canvas-toggle-btn" type="button" title="显示/隐藏路径" aria-label="切换路径">路</button>
              <button id="undo" class="canvas-icon-btn" type="button" title="撤销 (Ctrl+Z)" aria-label="撤销">↶</button>
              <button id="redo" class="canvas-icon-btn" type="button" title="恢复 (Ctrl+Y)" aria-label="恢复">↷</button>
            </div>
            <canvas id="canvas" hidden></canvas>
            <div class="empty" id="empty">导入透明 PNG、白底或纯色底图。<br>按住鼠标或触控笔，沿要处理的图案中心线绘制路径。</div>
          </div>
        </div>

        <div class="preview-strip resizable" id="previewStrip" hidden>
          <div class="resize-handle" aria-hidden="true"></div>
          <div class="preview-card">
            <div class="preview-label"><span>溶解图</span><span id="dissolveState">0%</span></div>

    canvas.addEventListener('contextmenu',e=>{e.preventDefault();if(!state.image)return;const before=snapshot();if(state.activePath&&state.activePath.anchors.length<2)state.paths=state.paths.filter(path=>path!==state.activePath);state.activePath=null;state.pathScope='all';updateScopeButtons();commit(before);draw();});
    canvas.addEventListener('pointerdown',e=>{if(!state.image||e.button!==0)return;const p=point(e),before=snapshot();canvas.setPointerCapture(e.pointerId);state.pointerStart=p;state.changed=false;if(state.tool==='pen'){if(!state.activePath){state.activePath={kind:'pen',anchors:[]};state.paths.push(state.activePath);}const anchor={x:p.x,y:p.y,in:{...p},out:{...p}};state.activePath.anchors.push(anchor);state.dragging={path:state.activePath,anchor,type:'out',before};state.dragAnchorStart={x:p.x,y:p.y,in:{...p},out:{...p}};state.changed=true;}else if(state.tool==='add'){const curve=nearestCurve(p);if(curve&&curve.distance<18){splitCurve(curve);state.changed=true;commit(before);}}else{const hit=hitTest(p);if(hit){state.activePath=hit.path;state.pathScope='current';state.dragging={...hit,before};state.dragAnchorStart={x:hit.anchor.x,y:hit.anchor.y,in:{...hit.anchor.in},out:{...hit.anchor.out}};}}updateScopeButtons();draw();});
    canvas.addEventListener('pointermove',e=>{if(!state.dragging)return;const p=point(e),drag=state.dragging,anchor=drag.anchor,start=state.dragAnchorStart;if(drag.type==='anchor'){const dx=p.x-state.pointerStart.x,dy=p.y-state.pointerStart.y;anchor.x=start.x+dx;anchor.y=start.y+dy;anchor.in={x:start.in.x+dx,y:start.in.y+dy};anchor.out={x:start.out.x+dx,y:start.out.y+dy};}else{anchor[drag.type]=p;const opposite=drag.type==='in'?'out':'in';anchor[opposite]={x:anchor.x-(p.x-anchor.x),y:anchor.y-(p.y-anchor.y)};}state.changed=true;draw();});
    canvas.addEventListener('pointerup',()=>{if(state.dragging&&state.changed)commit(state.dragging.before);state.dragging=null;draw();});
    Object.values(controls).forEach(el=>el.addEventListener('input',()=>{updateLabels();draw();scheduleSave();}));document.querySelector('#clear').onclick=()=>{const before=snapshot();state.paths=[];state.activePath=null;state.pathScope='all';updateScopeButtons();commit(before);draw();};document.querySelectorAll('[data-bg]').forEach(btn=>btn.onclick=()=>{state.background=btn.dataset.bg;document.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('active',b===btn));scheduleSave();});document.querySelectorAll('[data-canvas-bg]').forEach(btn=>btn.onclick=()=>{state.canvasBackground=btn.dataset.canvasBg;document.querySelectorAll('[data-canvas-bg]').forEach(b=>b.classList.toggle('active',b===btn));draw();scheduleSave();});document.querySelectorAll('[data-tool]').forEach(btn=>btn.onclick=()=>{state.tool=btn.dataset.tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b===btn));updateCursor();draw();});document.querySelectorAll('[data-path-scope]').forEach(btn=>btn.addEventListener('click',()=>{const next=btn.dataset.pathScope; if(next==='current' && !state.activePath) return; state.pathScope=next; updateScopeButtons(); draw();}));document.querySelector('#toggleSource').onclick=()=>{state.hideSource=!state.hideSource;draw();};document.querySelector('#togglePaths').onclick=()=>{state.hidePaths=!state.hidePaths;draw();};document.querySelector('#deletePath').onclick=()=>{if(!state.activePath)return;const before=snapshot();state.paths=state.paths.filter(path=>path!==state.activePath);state.activePath=null;state.pathScope='all';updateScopeButtons();commit(before);draw();};document.querySelector('#undo').onclick=()=>{if(!state.imageData || !state.history.length)return;const current=snapshot();const previous=state.history.pop();state.future.push(current);restore(previous);updateHistoryButtons();scheduleSave();};document.querySelector('#redo').onclick=()=>{if(!state.imageData || !state.future.length)return;const current=snapshot();const next=state.future.pop();state.history.push(current);restore(next);updateHistoryButtons();scheduleSave();};document.querySelector('#saveVersion').onclick=()=>saveProject(true);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProject();});window.addEventListener('pagehide',()=>saveProject());document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;if(e.key.toLowerCase()==='z'){e.preventDefault();document.querySelector('#undo').click();}if(e.key.toLowerCase()==='y'){e.preventDefault();document.querySelector('#redo').click();}});
    document.querySelector('#export').onclick=()=>{if(!state.image||!state.paths.some(path=>path.anchors.length>1))return;renderMask();const result=document.createElement('canvas');result.width=work.width;result.height=work.height;const r=result.getContext('2d'), data=mask.getContext('2d').getImageData(0,0,mask.width,mask.height); for(let i=0;i<data.data.length;i+=4){const gray=data.data[i], localAlpha=coverage((i/4)%work.width,Math.floor(i/4/work.width)),a=Math.round(data.data[i+3]/255*localAlpha*255);if(state.background==='transparent'){data.data[i]=gray;data.data[i+1]=gray;data.data[i+2]=gray;data.data[i+3]=a;}else {const bg=state.background==='white'?255:0, blend=a/255;const value=Math.round(bg*(1-blend)+gray*blend);data.data[i]=data.data[i+1]=data.data[i+2]=value;data.data[i]=data.data[i+1]=data.data[i+2]=value;data.data[i+3]=255;}}r.putImageData(data,0,0);const a=document.createElement('a');a.download='path-mask.png';a.href=result.toDataURL('image/png');a.click();};
    function setupResizablePanels(){
      const resizeTargets = [
        { element: document.querySelector('.panel'), axis: 'x', min: 260, max: 520 },
        { element: document.querySelector('.preview-strip'), axis: 'y', min: 120, max: 220 }
      ];

      let active = null;

      const onPointerMove = (event) => {
        if (!active) return;
        const { element, axis, startX, startY, startSize } = active;

        if (axis === 'x') {
          const next = startSize + (event.clientX - startX);
          element.style.width = `${Math.min(Math.max(next, 260), 520)}px`;
        }

        if (axis === 'y') {
          const next = startSize - (event.clientY - startY);
          element.style.height = `${Math.min(Math.max(next, 120), 220)}px`;
        }
      };

      const onPointerUp = () => {
        if (!active) return;
        active.element.classList.remove('is-resizing');
        active = null;
      };

      resizeTargets.forEach(({ element, axis, min, max }) => {
        if (!element) return;
        const handle = element.querySelector('.resize-handle');
        if (!handle) return;

        handle.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          event.stopPropagation();
          active = {
            element,
            axis,
            startX: event.clientX,
            startY: event.clientY,
            startSize: axis === 'x' ? element.getBoundingClientRect().width : element.getBoundingClientRect().height,
            min,
            max
          };
          element.classList.add('is-resizing');
          handle.setPointerCapture?.(event.pointerId);
        });
      });

      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    updateLabels();updateHistoryButtons();updateScopeButtons();updateCursor();setupResizablePanels();restoreLatest();
  </script>
